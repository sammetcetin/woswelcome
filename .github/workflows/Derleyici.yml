name: CloudStream Derleyici

concurrency:
  group: cloudstream-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak dalını al
        uses: actions/checkout@v4.2.2
        with:
          path: src

      - name: Dağıtım dalını al
        uses: actions/checkout@v4.2.2
        continue-on-error: true
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Dağıtım dalı yoksa boş hazırla
        shell: bash
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds/.git" ]; then
            rm -rf "$GITHUB_WORKSPACE/builds"
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init -b builds
            git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            if git fetch origin builds; then
              git reset --hard FETCH_HEAD
            fi
          fi

      - name: JDK 17 ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK ayarla
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo chown -R "$USER:$USER" "$SDK_ROOT"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "cmdline-tools bulunamadi" >&2
            exit 1
          fi
          # yes SIGPIPE (141) ile ölür; pipefail'in adımı düşürmemesi için || true.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Eklentileri derle
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson ensureJarCompatibility

      - name: Dağıtım klasörünü hazırla
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f \
            \( -name '*.cs3' -o -name '*.jar' -o -name 'plugins.json' -o -name 'repo.json' \) \
            -delete

          find "$GITHUB_WORKSPACE/src" -mindepth 3 -maxdepth 3 \
            -path '*/build/*.cs3' -type f \
            -exec cp '{}' "$GITHUB_WORKSPACE/builds/" ';'

          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"
          cp "$GITHUB_WORKSPACE/src/repo.json" "$GITHUB_WORKSPACE/builds/repo.json"
          python "$GITHUB_WORKSPACE/src/scripts/configure_repository.py" \
            --repo-json "$GITHUB_WORKSPACE/builds/repo.json" \
            --repository "$GITHUB_REPOSITORY"

      - name: Dağıtımı doğrula
        run: >-
          python src/scripts/validate_distribution.py
          --plugins-json builds/plugins.json
          --packages-dir builds

      - name: Dağıtım dalını güncelle
        working-directory: builds
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Dağıtım çıktılarında değişiklik yok."
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:builds
